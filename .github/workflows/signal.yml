name: signal
on:
  schedule:
    - cron: "1,16,31,46 * * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas
      - run: python signal_once.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
